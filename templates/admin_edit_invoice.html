{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Edit Invoice</h2>
    <div class="card shadow-sm" style="max-width: 800px;">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_invoice', invoice_id=invoice._id) }}">
                <h5 class="mb-3 text-primary">Client Details</h5>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Client Name</label>
                        <input type="text" name="client_name" class="form-control" value="{{ invoice.client_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Client Phone</label>
                        <input type="text" name="client_phone" class="form-control" value="{{ invoice.client_phone }}" required>
                    </div>
                </div>
                
                <h5 class="mb-3 text-primary">Billing Details</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold">Transportation & Service Details</label>
                    <textarea name="transportation_details" class="form-control" rows="3" required>{{ invoice.transportation_details }}</textarea>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Base Amount ($)</label>
                        <input type="number" step="0.01" name="base_amount" class="form-control" value="{{ invoice.base_amount }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Taxes ($)</label>
                        <input type="number" step="0.01" name="taxes" class="form-control" value="{{ invoice.taxes }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Discount ($)</label>
                        <input type="number" step="0.01" name="discount" class="form-control" value="{{ invoice.discount }}" required>
                    </div>
                </div>
                
                <div class="d-flex gap-2 border-top pt-4">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="{{ url_for('view_invoice', invoice_id=invoice._id) }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
