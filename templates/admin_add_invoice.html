{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Create New Invoice</h2>
    <div class="card shadow-sm" style="max-width: 800px;">
        <div class="card-body">
            <form method="POST" action="{{ url_for('add_invoice') }}">
                <h5 class="mb-3 text-primary">Client Details</h5>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Client Name</label>
                        <input type="text" name="client_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Client Phone</label>
                        <input type="text" name="client_phone" class="form-control" required>
                    </div>
                </div>
                
                <h5 class="mb-3 text-primary">Billing Details</h5>
                <div class="mb-3">
                    <label class="form-label fw-bold">Transportation & Service Details</label>
                    <textarea name="transportation_details" class="form-control" rows="3" required></textarea>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Base Amount ($)</label>
                        <input type="number" step="0.01" name="base_amount" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Taxes ($)</label>
                        <input type="number" step="0.01" name="taxes" class="form-control" value="0" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Discount ($)</label>
                        <input type="number" step="0.01" name="discount" class="form-control" value="0" required>
                    </div>
                </div>
                
                <div class="d-flex gap-2 border-top pt-4">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-file-invoice"></i> Create Invoice</button>
                    <a href="{{ url_for('admin_invoices') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
