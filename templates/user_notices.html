{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Official Notices</h2>
    
    <div class="row">
        <div class="col-lg-8">
            {% for notice in notices %}
            <div class="card shadow-sm mb-3 border-start border-4 {% if notice.target_ship == 'all' %}border-primary{% else %}border-warning{% endif %}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge {% if notice.target_ship == 'all' %}bg-primary{% else %}bg-warning text-dark{% endif %}">{% if notice.target_ship == 'all' %}Broadcast (All Ships){% else %}Vessel Specific{% endif %}</span>
                    </div>
                    <p class="mb-0 fs-5">{{ notice.description }}</p>
                </div>
            </div>
            {% else %}
            <div class="alert alert-light border text-center py-5">No active notices for your assigned vessel.</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
