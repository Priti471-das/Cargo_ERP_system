{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Edit User: {{ user.name }}</h2>
    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_user', user_id=user._id) }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold">Salary ($)</label>
                        <input type="number" name="salary" class="form-control" value="{{ user.salary }}" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Address</label>
                    <input type="text" name="address" class="form-control" value="{{ user.address }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Role</label>
                    <select name="role" class="form-select">
                        <option value="user" {% if user.role == 'user' %}selected{% endif %}>Regular User / Crew</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Allot Ship</label>
                    <select name="allotted_ship" class="form-select">
                        <option value="None" {% if user.allotted_ship == 'None' %}selected{% endif %}>None (Shore Staff)</option>
                        {% for ship in ships %}
                        <option value="{{ ship._id }}" {% if user.allotted_ship == ship._id|string %}selected{% endif %}>{{ ship.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Reset Password <small class="text-muted fw-normal">(leave blank to keep current)</small></label>
                    <input type="password" name="password" class="form-control" placeholder="New password...">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
