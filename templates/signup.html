{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Get Started</h2>
            <p class="text-muted">Create your initial Admin workspace</p>
        </div>
        <form method="POST" action="{{ url_for('signup') }}">
            <div class="mb-3">
                <label for="name" class="form-label fw-medium">Full Name</label>
                <input type="text" class="form-control form-control-lg bg-light" id="name" name="name" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Work Email</label>
                <input type="email" class="form-control form-control-lg bg-light" id="email" name="email" placeholder="name@company.com" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">Password</label>
                <input type="password" class="form-control form-control-lg bg-light" id="password" name="password" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">Create Account</button>
        </form>
        <div class="text-center mt-4">
            <p class="text-muted">Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
