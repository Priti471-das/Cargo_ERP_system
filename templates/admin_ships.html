{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Manage Ships</h2>
    
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Add New Ship</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_ships') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ship Name</label>
                            <input type="text" name="name" class="form-control" required placeholder="e.g. Oceanic Alpha">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Capacity (TEU)</label>
                            <input type="number" name="capacity" class="form-control" required placeholder="e.g. 15000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Daily Cost ($)</label>
                            <input type="number" name="cost" class="form-control" required placeholder="e.g. 50000">
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-plus"></i> Add Ship</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr><th>Name</th><th>Capacity</th><th>Daily Cost</th><th>AI Health Forecast</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            {% for ship in ships %}
                            <tr>
                                <td><strong>{{ ship.name }}</strong></td>
                                <td>{{ ship.capacity }} TEU</td>
                                <td>${{ ship.cost }}</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <i class="fas fa-stethoscope fs-4 me-2 {% if ship.ai_maintenance_days < 15 %}text-danger{% elif ship.ai_maintenance_days < 30 %}text-warning{% else %}text-success{% endif %}"></i>
                                        <span>Service in <strong>{{ ship.ai_maintenance_days }}</strong> days</span>
                                    </div>
                                </td>
                                <td><a href="{{ url_for('delete_ship', ship_id=ship._id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this ship?');"><i class="fas fa-trash"></i></a></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div></div></div>
    </div></div>
{% endblock %}
