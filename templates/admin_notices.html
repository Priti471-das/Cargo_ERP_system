{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
    <h2 class="mt-4 mb-4">Manage Notices</h2>
    
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Publish Notice</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_notices') }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Notice Description</label>
                            <textarea name="description" class="form-control" rows="4" required placeholder="Enter the announcement or warning here..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Target</label>
                            <select name="target_ship" class="form-select">
                                <option value="all">Broadast to All Ships & Crew</option>
                                {% for ship in ships %}
                                <option value="{{ ship.name }}">Specific: {{ ship.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-paper-plane"></i> Publish</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr><th>Notice Description</th><th>Target Audience</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            {% for notice in notices %}
                            <tr>
                                <td>{{ notice.description }}</td>
                                <td><span class="badge {% if notice.target_ship == 'all' %}bg-primary{% else %}bg-info text-dark{% endif %}">{{ notice.target_ship|upper }}</span></td>
                                <td><button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div></div></div>
    </div></div>
{% endblock %}
